name: Python CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-static-checks:
    name: Python static checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: service-api/service-python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            service-api/service-python/requirements.txt
            tests/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r ../../tests/requirements-test.txt

      - name: Compile Python sources
        run: python -m compileall src

  compose-contracts:
    name: Compose and contract checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose file
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Validate contract files
        run: |
          test -f docs/contracts/http/schemaapi.openapi.yaml
          test -f docs/contracts/registry.json
          test -f docs/contracts/events/document.ingested.schema.json
          test -f docs/contracts/events/document.processed.schema.json
          test -f docs/contracts/events/rag.query-executed.schema.json
          test -f docs/contracts/events/rag.eval-created.schema.json

  e2e-smoke:
    name: Docker e2e smoke
    runs-on: ubuntu-latest
    needs:
      - python-static-checks
      - compose-contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke workflow
        run: bash scripts/test.sh smoke
