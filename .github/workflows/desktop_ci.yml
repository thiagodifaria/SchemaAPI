name: Desktop CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-build:
    name: TypeScript and desktop bundle
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build desktop
        run: npm run build
